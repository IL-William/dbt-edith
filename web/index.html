        <button class="tab active" data-dock="lineage"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.25" y="5.75" width="4.5" height="4.5" rx="1"/><rect x="10.25" y="1.75" width="4.5" height="4.5" rx="1"/><rect x="10.25" y="9.75" width="4.5" height="4.5" rx="1"/><path d="M5.75 8C8 8 8 4 10.25 4M5.75 8C8 8 8 12 10.25 12"/></svg><span>Lineage</span></button>
        <button class="tab" data-dock="terminal"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4l4 4-4 4M8.5 12.25h5"/></svg><span>Terminal</span></button>
        <button class="tab" data-dock="catalog"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><path d="M1.75 6.25h12.5M1.75 9.75h12.5M6 6.25v7"/></svg><span>Catalog</span></button>
        <button class="tab" data-dock="jobs"
                title="Which of the orchestrator's jobs run this node, read from their YAML"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="3" width="12.5" height="11" rx="1.5"/><path d="M1.75 6.5h12.5M5 1.5v3M11 1.5v3"/></svg><span>Jobs</span></button>
        <button class="tab" data-dock="compiled" title="The model's SQL with the Jinja gone, from target/compiled/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.25 4L1.5 8l3.75 4M10.75 4l3.75 4-3.75 4"/></svg><span>Compiled</span></button>
        <button class="tab" data-dock="run" title="The statement dbt executed to materialise it, from target/run/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.75v10.5L13.25 8z"/></svg><span>Run</span></button>
        <button class="tab hidden" data-dock="history" id="history-tab"
                title="Your own queries in Snowflake over the last 7 days, read when the tab opens"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.45 9.5A5.75 5.75 0 1 0 3.3 4.7"/><path d="M3.3 1.95V4.7h2.75M8 5v3.25l2.25 1.5"/></svg><span>Query history</span></button>
        <div class="grow"></div>
        <div id="lineage-tools" class="tools">
          <span id="graph-mode" class="seg">
            <button class="segbtn active" data-mode="model"
                    title="One model and its neighbours, as far up and down as the up and down boxes say. Click a box or open a model to move the focus.">Models</button>
            <button class="segbtn" data-mode="column" disabled>Columns</button>
            <button class="segbtn" data-mode="select" aria-controls="select-panel" aria-expanded="false"
                    title="Any set of nodes you describe, drawn together over the whole window: names, tag:, path: and the other dbt methods, + and @ for what feeds them and what they feed, or one of the project's named selectors from selectors.yml. Read from the manifest: nothing runs dbt.">Custom selection</button>
          </span>
          <span id="col-chip" class="colchip hidden"></span>
          <label title="Levels of parents drawn. Back to 1 when the model changes other than from the canvas">up <input id="up" type="number" min="0" max="20" value="1"></label>
          <label title="Levels of children drawn. Back to 1 when the model changes other than from the canvas">down <input id="down" type="number" min="0" max="20" value="1"></label>
          <!-- An arrow into a bar: the walk going down and stopping. The label
               names what it stops at, and is empty while it stops at nothing,
               the bar being full in column mode. -->
          <button id="stop-at" class="btn sm eyebtn hidden" type="button" aria-haspopup="menu"
                  aria-label="Stop the walk downstream at"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8H10.5M7.5 5L10.5 8L7.5 11M13.5 3.5V12.5"/></svg><span></span></button>
          <!-- collin's indirect edges, walked and drawn dashed when pressed,
               left out by default; an eye like the tests one (0097). -->
          <button id="indirect-btn" class="btn sm eyebtn hidden" type="button" aria-pressed="false"
                  aria-label="collin's indirect edges on the canvas"></button>
          <!-- An eye drawn by testsEye(), as the snowflake by snowflakeIcon(). -->
          <button id="with-tests" class="btn sm eyebtn" type="button" aria-pressed="false"
                  aria-label="Data tests on the canvas"></button>
          <!-- A toggle like the eye beside it, so the two read as one family. -->
          <span id="folder-tool" class="foldertool">
          <button id="by-folder" class="btn sm eyebtn folderbtn" type="button" aria-pressed="false"
                  title="One band of columns per folder, where the models drawn stop sharing a path, left to right in the order of the folders' numbers, then of the edges between them"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5V12.5H14.5V5.5H7.5L6 3.5H1.5Z"/><path d="M5.5 7.5V12.5M10 7.5V12.5"/></svg><span>by folder</span></button>
          <!-- Opened under the toggle, over the canvas, by wireFolderLevels(). -->
          <label id="folder-levels-box" title="How many levels of folders to draw: 1 gives a band to each folder where the models drawn stop sharing a path, 2 cuts each band again by its sub-folders, and so on, as deep as a path goes">levels <input id="folder-levels" type="number" min="1" max="4" value="1"></label>
          </span>
          <!-- Four corners closing on the graph; a file coming down into a
               tray; a picture, which is what tells this Copy from the
               selection bar's, a list. -->
          <button class="btn sm icobtn" id="fit-btn" type="button"
                  title="Fit the whole graph in the pane"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2.5H5.5M10.5 2.5H14V6M14 10V13.5H10.5M5.5 13.5H2V10"/></svg><span>Fit</span></button>
          <button class="btn sm icobtn" id="export-btn" type="button"
                  title="Save what the canvas shows as one HTML file: opens offline, zooms without blurring, prints to one page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V10M4.75 6.75L8 10L11.25 6.75M2.5 10.5V13.5H13.5V10.5"/></svg><span>Export</span></button>
          <button class="btn sm icobtn" id="image-btn" type="button"
                  title="Copy the canvas as a PNG picture, to paste into a ticket"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5H14V12.5H2Z"/><path d="M2 11L5.75 7.25L9 10.5L10.75 8.75L14 12"/><circle cx="10.75" cy="6" r="1.1"/></svg><span>Copy image</span></button>
        </div>
      </div>
      <div id="dock-lineage" class="dock-pane">
        <!-- What floats over the top of the canvas, one under the other: the
             selector bar in Custom selection, or the note on a canvas that
             is not of the file in front in model mode, then the find bar,
             which app.js adds on Cmd+F. -->
        <div id="lineage-top" class="lineage-top">
          <div id="select-bar" class="select-bar hidden">
            <div class="select-row">
              <button class="btn sm" id="select-named" aria-haspopup="menu"
                      title="Pick one of the project's named selectors, as the manifest recorded selectors.yml">Selectors ▾</button>
              <input id="select-input" spellcheck="false" autocomplete="off"
                     placeholder="stg_customers dim_customers+ tag:nightly, or --selector name"
                     aria-label="dbt node selection expression, or --selector and a name">
              <span id="select-sum" class="sel-sum"></span>
              <!-- A list, against the picture of Copy image above the canvas;
                   dbt ls takes the Terminal tab's glyph, where it types. -->
              <button class="btn sm icobtn" id="select-copy" type="button"
                      title="Copy the matching names, one per line, the way dbt ls --output name prints them"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4H13.5M6 8H13.5M6 12H13.5M2.4 4H2.9M2.4 8H2.9M2.4 12H2.9"/></svg><span>Copy names</span></button>
              <button class="btn sm icobtn" id="select-ls" type="button"
                      title="Type the dbt ls that should print the same list into the terminal, without running it"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4l4 4-4 4M8.5 12.25h5"/></svg><span>dbt ls</span></button>
            </div>
            <div id="select-warn" class="sel-warn hidden"></div>
          </div>
          <div id="lineage-note" class="lineage-note hidden" role="status"></div>
        </div>
        <div id="lineage-empty" class="empty"><p>Select a model to see its lineage.</p></div>
        <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="lineage-legend" class="legend"></div>
        <div id="lineage-status" class="graph-status"></div>
        <!-- A column canvas cut at its cap: the button that draws more, this time only (0118). -->
        <div id="lineage-cap" class="graph-cap hidden"></div>
      </div>
      <div id="dock-terminal" class="dock-pane hidden">
        <div id="term"></div>
      </div>
      <div id="dock-compiled" class="dock-pane hidden">
        <div id="compiled-head" class="compiled-head"></div>
        <div id="compiled-body" class="compiled-body"></div>
      </div>
      <div id="dock-run" class="dock-pane hidden">
        <div id="run-head" class="compiled-head"></div>
        <div id="run-body" class="compiled-body"></div>
      </div>
      <div id="dock-history" class="dock-pane hidden"></div>
      <div id="dock-jobs" class="dock-pane hidden">
        <div id="jobs-head" class="compiled-head"></div>
        <div id="jobs-body" class="jobs-body"></div>
      </div>
      <div id="dock-catalog" class="dock-pane hidden">
        <div id="catalog" class="catalog"><p class="muted pad">No node selected. Open a model, or pick one in the lineage.</p></div>
      </div>
    </section>

    <!-- The panels, over the editor and the dock rather than in their place, so
         nothing under them is measured again when one rolls up or down (0064, 0091). -->
    <section id="reports" class="panel reports" tabindex="-1" aria-label="Reports" aria-hidden="true">
      <nav id="reports-nav" class="reports-nav" aria-label="Reports"></nav>
      <div id="reports-view" class="reports-view"></div>
    </section>
    <!-- The settings, a section at a time, as the reports are (0100). -->
    <section id="settings" class="panel settings" tabindex="-1" aria-label="Settings" aria-hidden="true">
      <nav id="settings-nav" class="reports-nav" aria-label="Settings"></nav>
      <div id="settings-view" class="reports-view"></div>
    </section>
  </main>

  <!-- Custom selection over the whole window, the sidebar too (0092, 0101). It
       holds nothing of its own: selectPanelDown() brings the dock's canvas up
       into it, the selector bar over it and the canvas's tools, and the
       Catalog into the card, which a box clicked opens. -->
  <section id="select-panel" class="panel selpanel" tabindex="-1" aria-label="Custom selection" aria-hidden="true">
    <div class="selpanel-head">
      <span class="selpanel-title">Custom selection</span>
      <div class="grow"></div>
      <span id="selpanel-tools" class="tools"></span>
      <button class="icon" id="selpanel-close" type="button" aria-label="Close the selection">×</button>
    </div>
    <div class="selpanel-body">
      <div id="selpanel-canvas" class="selpanel-canvas"></div>
      <aside id="selpanel-card" class="selpanel-card hidden" aria-label="The box clicked">
        <!-- Its left edge, dragged to make the card wider or narrower, as the gutters are. -->
        <div class="selpanel-grip" id="selpanel-grip"></div>
        <button class="icon selpanel-cardx" id="selpanel-card-close" type="button" aria-label="Close the card">×</button>
      </aside>
    </div>
  </section>
</div>

<footer id="statusbar">
  <span id="status-file" class="muted">no file</span>
  <div class="grow"></div>
  <!-- Each opens its section of the settings (0100). -->
  <button id="status-venv" class="venvpill" type="button" aria-controls="settings"></button>
  <button id="status-env" class="envpill hidden" type="button" aria-controls="settings"></button>
  <span id="status-branch" class="muted" title="Switch branch"></span>
  <span id="status-shell" class="muted"></span>
  <span id="status-manifest" class="muted"></span>
  <span id="status-build" class="muted"></span>
  <button id="status-update" class="updpill hidden" type="button" aria-controls="settings"></button>
</footer>

<div id="palette" class="hidden">
  <div class="palette-box">
    <input id="palette-input" placeholder="Search models, sources, macros and every file in the project…" spellcheck="false" autocomplete="off">
    <div id="palette-results"></div>
  </div>
</div>

<div id="toast"></div>

<div id="branches" class="hidden">
  <div class="palette-box">
    <input id="branch-filter" placeholder="Switch to branch…" spellcheck="false" autocomplete="off">
    <div id="branch-results"></div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>

<!-- Where the Halloween look's apparitions cross the window; takes no click (0106). -->
<div id="hw-layer" aria-hidden="true"></div>

<script src="vendor/codemirror.js"></script>
<script src="vendor/diff_match_patch.js"></script>
<script src="vendor/cm-merge.js"></script>
<script src="vendor/cm-mode-sql.js"></script>
<script src="vendor/cm-mode-yaml.js"></script>
<script src="vendor/cm-mode-markdown.js"></script>
<script src="vendor/cm-mode-jinja2.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="lineage.js"></script>
<script src="app.js"></script>
</body>
</html>
