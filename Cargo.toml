[package]
name = "dbt-edith"
version = "2.24.0"
edition = "2021"
rust-version = "1.82"
description = "A tiny browser-based IDE for dbt projects: editor, terminal and lineage from manifest.json"
license = "FSL-1.1-MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
mime_guess = "2"
portable-pty = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }

# Clippy runs with -D warnings in check.sh and CI (0171). These three are design
# choices, not slips: the printers take their inputs as arguments rather than
# through a context struct, a few payload types nest tuples that a `type` alias
# would only rename, and the handlers return an axum `Response` as their `Err`.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
