name: release

# A version in Cargo.toml with no tag yet is released from main: the tag and the
# GitHub release are created together at the commit that was pushed, and the
# notes are that version's section of CHANGELOG.md (0045). The release is the
# source, and for Windows the two .exe files CI builds on a native runner, with
# their SHA-256 (0123) and their build provenance attested.
#
# Before the tag exists, those two files are sent to VirusTotal, and a flag from
# any engine stops the release (0152). A release cannot be changed once it is
# out, so the check has to be on the files the release job uploads and before it
# runs. A run by hand with the box ticked publishes anyway. After an outage or
# an analysis that was slow, "Re-run failed jobs" scans the same artifacts again
# and uploads nothing VirusTotal already has.
#
# The tag is made here rather than pushed by hand: one pushed by hand is the
# step that gets left for later, and a version bumped on main and never tagged
# is how 0.5.0 came not to exist.
#
# A pull request that touches this file, the notes script or the crate reads the
# version and the notes and builds the .exe files without publishing: tags here
# cannot be moved or deleted, so a broken release has to be found before its tag
# exists.
on:
  push:
    branches: [main]
    # A release needs a new version, and this file in case the last attempt
    # failed for a reason fixed here.
    paths: [Cargo.toml, .github/workflows/release.yml]
  pull_request:
    # This file and the notes script, and whatever can break the Windows build:
    # the crate, its lockfile, its build script.
    paths:
      - .github/workflows/release.yml
      - scripts/release_notes.sh
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
  # A release that failed on something outside this repository, retried on
  # main as it is, or one a VirusTotal flag blocked and that is published anyway.
  workflow_dispatch:
    inputs:
      publish_even_if_flagged:
        description: Publish even if a VirusTotal engine flags a file
        type: boolean
        default: false

permissions:
  contents: read

# Two pushes to main in a row must not both find the same version untagged.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version Cargo.toml names, whether main still owes it a release, and its
  # notes, which fail this job when CHANGELOG.md has none for it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      due: ${{ steps.read.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            due=false
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            due=false
          else
            due=true
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "v$version, release due: $due"
      - name: The notes
        run: scripts/release_notes.sh

  # The Windows .exe files, each built and run where Windows is native: x64 for
  # nearly every Windows machine, ARM64 for Windows on ARM (0123). Nothing here
  # can write, and a pull request that touches the crate builds them too, so the
  # build is proven before it is due.
  windows:
    needs: version
    if: needs.version.outputs.due == 'true' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dbt-edith.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: dbt-edith-arm64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The download command in the real Windows shells, Git Bash and PowerShell
      # 5.1, which no other job has, on each architecture.
      - name: The update downloads in both shells
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --release --target "$TARGET" \
            -- --exact update::tests::the_real_windows_shells_download_check_and_swap | tee test.out
          # Not vacuous: one test ran, and passed.
          grep -q "test result: ok. 1 passed" test.out
      - name: Build
        env:
          # The binary then updates itself by downloading the next one.
          DBT_EDITH_RELEASE_ASSET: "1"
          TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build --release --locked --target "$TARGET"
      # The pair `sha256sum -c` reads, with the bare file name, as
      # scripts/build_windows.sh writes it.
      - name: Name it and hash it
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/dbt-edith.exe" "dist/$ASSET"
          hash=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$ASSET" > "dist/$ASSET.sha256"
          cat "dist/$ASSET.sha256"
      - name: It starts
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: dist/$ASSET --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          # A pull request's files are only looked at; a release's keep the
          # repository's default (0), which a re-run of a failed release job
          # still needs.
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 0 }}

  # The two .exe files as the release job will upload them, sent to VirusTotal
  # (0152). Only a release that is due is checked: a pull request's build carries
  # another build stamp, so it is not the file that ships, and the verdicts of
  # near-identical builds have differed (0123). A flag by any engine fails this
  # job and so blocks the release, unless the run was started by hand with the
  # override ticked. A file VirusTotal already has is not sent again, so
  # "Re-run failed jobs" after an outage or an analysis that was slow looks at the
  # same artifacts and reads the same report.
  virustotal:
    needs: [version, windows]
    if: needs.version.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist
      - name: The files are as they were built
        working-directory: dist
        run: sha256sum -c dbt-edith.exe.sha256 dbt-edith-arm64.exe.sha256
      # The free key allows 4 requests a minute: every call waits 15 s first, and
      # a 429 waits a minute and asks again. The key is only ever in the header
      # file curl reads, and nothing here prints it.
      - name: Scan them on VirusTotal
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          # Empty on a push, which counts as false.
          FORCE: ${{ inputs.publish_even_if_flagged }}
        run: |
          set -euo pipefail
          if [ -z "$VT_KEY" ]; then
            echo "::error::The VIRUSTOTAL_API_KEY repository secret is not set, so no release can be checked or published. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          api=https://www.virustotal.com/api/v3
          work=$RUNNER_TEMP/vt
          mkdir -p "$work"
          body=$work/body.json
          (umask 077; printf 'x-apikey: %s\n' "$VT_KEY" > "$work/header")

          # vt METHOD PATH [curl args]: prints the HTTP code, the body is in $body.
          vt() {
            local method=$1 path=$2 try code
            shift 2
            for try in 1 2 3 4 5; do
              sleep 15
              rm -f "$body"
              code=$(curl -sS --proto =https -X "$method" -H "@$work/header" \
                -o "$body" -w '%{http_code}' "$@" "$api$path") || code=000
              if [ "$code" != 429 ]; then
                echo "$code"
                return 0
              fi
              [ "$try" -lt 5 ] && sleep 60
            done
            echo 429
          }
          # unexpected WHAT CODE: the status and VirusTotal's own error code.
          unexpected() {
            local why
            why=$(jq -r '.error.code // empty | gsub("[^A-Za-z0-9]"; "")' "$body" 2>/dev/null || true)
            echo "::error::VirusTotal answered $2 to $1 (${why:-no error code})."
            exit 1
          }
          # has_results FILE: whether a report holds the engines' verdicts.
          has_results() {
            [ "$(jq '(.data.attributes.last_analysis_results // {}) | length' "$1")" -gt 0 ]
          }

          files=(dbt-edith.exe dbt-edith-arm64.exe)
          shas=()
          ids=()
          # Both files are sent first, so their analyses run side by side.
          for i in "${!files[@]}"; do
            file=${files[$i]}
            sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
            shas[$i]=$sha
            ids[$i]=
            rm -f "$work/$i.json"
            code=$(vt GET "/files/$sha")
            case "$code" in
              200) cp "$body" "$work/$i.json" ;;
              404) ;;
              *) unexpected "the lookup of $file" "$code" ;;
            esac
            if [ ! -f "$work/$i.json" ]; then
              code=$(vt POST /files -F "file=@dist/$file")
              [ "$code" = 200 ] || unexpected "the upload of $file" "$code"
              ids[$i]=$(jq -r '.data.id' "$body")
              echo "$file sent"
            elif has_results "$work/$i.json"; then
              echo "$file is already known"
            else
              echo "$file is known, its analysis is not finished"
            fi
          done

          deadline=$((SECONDS + 1800))
          for i in "${!files[@]}"; do
            file=${files[$i]}
            sha=${shas[$i]}
            while ! { [ -f "$work/$i.json" ] && has_results "$work/$i.json"; }; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::The analysis of $file did not finish; re-run the failed jobs."
                exit 1
              fi
              if [ -n "${ids[$i]}" ]; then
                # Sent by this run: the analysis says when the report is whole.
                code=$(vt GET "/analyses/${ids[$i]}")
                [ "$code" = 200 ] || unexpected "the analysis of $file" "$code"
                if [ "$(jq -r '.data.attributes.status' "$body")" = completed ]; then
                  code=$(vt GET "/files/$sha")
                  [ "$code" = 200 ] || unexpected "the report of $file" "$code"
                  cp "$body" "$work/$i.json"
                  if has_results "$work/$i.json"; then
                    break
                  fi
                  # Completed but still empty: ask the file's report, as for one
                  # sent by an earlier run, until the deadline.
                  ids[$i]=
                fi
              else
                # Sent by an earlier run: the file's own report fills in.
                code=$(vt GET "/files/$sha")
                [ "$code" = 200 ] || unexpected "the report of $file" "$code"
                cp "$body" "$work/$i.json"
              fi
              sleep 60
            done
          done

          # Flagged is malicious plus suspicious. Engine names and verdicts come
          # from VirusTotal, so only plain characters are kept of them before they
          # reach a log command or the summary.
          defs='def clean: gsub("[^A-Za-z0-9 ._:/!()+,-]"; "");
                def hit: select(.category == "malicious" or .category == "suspicious");'
          flagged_any=false
          blocked=
          {
            echo "### VirusTotal"
            echo
            echo "| File | SHA-256 | Flagged / engines | Report |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          : > "$work/details.md"
          for i in "${!files[@]}"; do
            file=${files[$i]}
            sha=${shas[$i]}
            report=$work/$i.json
            flagged=$(jq '(.data.attributes.last_analysis_stats.malicious // 0) + (.data.attributes.last_analysis_stats.suspicious // 0)' "$report")
            engines=$(jq '.data.attributes.last_analysis_results | length' "$report")
            echo "| \`$file\` | \`$sha\` | $flagged / $engines | [report](https://www.virustotal.com/gui/file/$sha) |" >> "$GITHUB_STEP_SUMMARY"
            echo "$file: $flagged of $engines engines flag it"
            if [ "$flagged" -gt 0 ]; then
              flagged_any=true
              jq -r --arg f "$file" "$defs"'
                .data.attributes.last_analysis_results[] | hit
                | "- `\($f)`: \(.engine_name | clean): `\((.result // .category) | clean)`"' \
                "$report" >> "$work/details.md"
              names=$(jq -r "$defs"'
                [.data.attributes.last_analysis_results[] | hit | .engine_name | clean]
                | unique | join(", ")' "$report")
              blocked="${blocked:+$blocked; }$file ($names)"
            fi
          done
          if [ -s "$work/details.md" ]; then
            { echo; cat "$work/details.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$flagged_any" = true ]; then
            if [ "$FORCE" = true ]; then
              echo "::warning::VirusTotal flagged $blocked. Published anyway, as the run asked."
              exit 0
            fi
            echo "::error::The release was not published: VirusTotal flagged $blocked. To publish anyway, run the release workflow by hand on main with \"Publish even if a VirusTotal engine flags a file\" ticked; it builds again and checks the new files."
            exit 1
          fi

  # Only this job can write, and only on main with a version still untagged.
  release:
    needs: [version, windows, virustotal]
    if: needs.version.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestation is signed with this workflow's identity, and stored
      # with the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist
      - name: The files are as they were built
        working-directory: dist
        run: sha256sum -c dbt-edith.exe.sha256 dbt-edith-arm64.exe.sha256
      # Which workflow and commit built each file, kept on GitHub rather than
      # beside the file as the .sha256 is. The files are the ones just checked,
      # and Publish uploads these same paths. The .sha256 files are not
      # attested: they are not what anyone runs.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            scripts/release_notes.sh
            echo
            echo 'For Windows, `dbt-edith.exe` is attached, and `dbt-edith-arm64.exe` for Windows on ARM,'
            echo "each with its SHA-256 beside it: see"
            echo "[docs/windows.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/windows.md#download-it)."
            echo "Elsewhere dbt-edith is built, as"
            echo "[the README](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/README.md#install-it)"
            echo "describes."
          } > "$RUNNER_TEMP/notes.md"
          # The tag is created with the release, at the commit this run checked
          # out. With files to attach, gh makes a draft, uploads them and then
          # publishes, so the tag and the .exe files appear together.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Edith $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/dbt-edith.exe dist/dbt-edith.exe.sha256 \
            dist/dbt-edith-arm64.exe dist/dbt-edith-arm64.exe.sha256
      # The URL the update downloads from, as it serves them now: a wrong name or
      # a redirect off HTTPS shows here and not at the next release. "latest"
      # may lag the release by a moment, so it is asked again.
      - name: The update's URL serves them
        run: |
          for asset in dbt-edith.exe dbt-edith-arm64.exe; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$asset.sha256"
            served=false
            for try in 1 2 3 4 5; do
              if curl -fsSL --proto =https --proto-redir =https -o "$RUNNER_TEMP/$asset.sha256" "$url" \
                && cmp -s "$RUNNER_TEMP/$asset.sha256" "dist/$asset.sha256"; then
                served=true
                break
              fi
              [ "$try" -lt 5 ] && sleep 10
            done
            if [ "$served" != true ]; then
              echo "::error::$url does not serve the file this release published. The release is published and immutable, so the fix is the next release."
              exit 1
            fi
          done
